# ArtCompanion tool-key mapping
# One entry per line: <single key> = <ToolState>
# Valid ToolState values: Brush, Eraser, Selection, Transform, Fill, Zoom, Text
#
# These are CSP's *default* single-key shortcuts. If you've rebound any
# tool shortcuts in CSP (File > Preferences > Shortcut Settings in the
# Japanese build), edit this file to match your actual bindings --
# the app re-reads it at every launch.

[Tools]
B=Brush
E=Eraser
M=Selection
T=Transform
G=Fill
Z=Zoom
